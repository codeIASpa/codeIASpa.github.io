<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - CodeIA</title>
    
    <!-- Load fonts from CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Bricolage+Grotesque:opsz,wght@10..48,100..900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Bricolage Grotesque', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-white font-sans">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-4xl font-bold text-purple-400 mb-4">🧠 CodeIA Test</h1>
        <p class="text-lg text-slate-300 mb-4">Si puedes ver este texto con la fuente Inter, las fuentes están funcionando correctamente.</p>
        
        <div class="bg-slate-800 p-6 rounded-lg border border-purple-500/30">
            <h2 class="text-2xl font-bold text-pink-400 mb-2">✅ Test de Estilos</h2>
            <p class="text-slate-300">Este es un test de los estilos básicos de Tailwind CSS.</p>
            <div class="mt-4 flex gap-2">
                <span class="px-3 py-1 bg-purple-600 text-white rounded-full text-sm">Purple</span>
                <span class="px-3 py-1 bg-pink-600 text-white rounded-full text-sm">Pink</span>
                <span class="px-3 py-1 bg-cyan-600 text-white rounded-full text-sm">Cyan</span>
            </div>
        </div>
        
        <div class="mt-8 text-center">
            <a href="http://localhost:4327/" class="inline-block px-6 py-3 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-lg font-semibold hover:from-purple-700 hover:to-pink-700 transition-all duration-300">
                Ir al sitio principal (puerto 4327)
            </a>
        </div>
    </div>
</body>
</html>
